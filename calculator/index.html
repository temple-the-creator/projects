<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator">
    <div class="result">0</div>
    <div class="btns">
      <button class="modifier-btn js-btn" data-action="delete">DEL</button>
      <button class="modifier-btn js-btn" data-action="clear">AC</button>
      <button class="modifier-btn js-btn" data-action="percent">%</button>
      <button class="function-btn js-btn" data-action="divide">÷</button>
      <button class="number-btn js-btn" data-value="7">7</button>
      <button class="number-btn js-btn" data-value="8">8</button>
      <button class="number-btn js-btn" data-value="9">9</button>
      <button class="function-btn js-btn" data-action="multiply">x</button>
      <button class="number-btn js-btn" data-value="4">4</button>
      <button class="number-btn js-btn" data-value="5">5</button>
      <button class="number-btn js-btn" data-value="6">6</button>
      <button class="function-btn js-btn" data-action="subtract">-</button>
      <button class="number-btn js-btn" data-value="1">1</button>
      <button class="number-btn js-btn" data-value="2">2</button>
      <button class="number-btn js-btn" data-value="3">3</button>
      <button class="function-btn js-btn" data-action="add">+</button>
      <button class="number-btn js-btn" data-action="/">/</button>
      <button class="number-btn js-btn" data-value="0">0</button>
      <button class="number-btn js-btn" data-value=".">.</button>
      <button class="function-btn js-btn" data-action="equals">=</button>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
