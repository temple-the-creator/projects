<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock-paper-scissors</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="title"> Rock paper scicssors</h1>
  <button onclick="playGame ('rock');" class="move-button">
    <img src="images/rock-emoji.png">
  </button>

  <button onclick="playGame ('paper');" class="move-button">
    <img src="images/paper-emoji.png">
  </button>

  <button onclick=" playGame ('scissors');" class="move-button">
    <img src="images/scissors-emoji.png">
  </button>

  <p class="js-moves"> 
    
  </p>

  <p class="js-result result"></p>

  <p class="js-score score"></p>

  <button onclick="
  score.Wins = 0;
  score.Losses = 0;
  score.Ties = 0;
  localStorage.removeItem('score');
  updateScoreElement ();
  " class="reset-score-button">Reset score</button>


  <script src="script.js"></script>
</body>
</html>
