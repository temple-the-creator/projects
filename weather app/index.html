<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>weather app</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">

    <div class="header__logo">

      <img src="/weather app/images/cloud.png" title="cloud icon" alt="cloud icon" class="header__logo-icon">
      <h3 class="header__logo-title">weather</h3>

    </div>

    <div class="temperature-unit">

      <label class="temperature-unit__cs">
        <input type="radio" value="celsius" name="unit" checked>
        <span>°C</span>
      </label>
      <label class="temperature-unit__fh">
        <input type="radio" value="fahrenheit" name="unit">
        <span>°F</span>
      </label>
    </div>

  </header>

  <section class="search">

    <input type="search" class="search__bar" placeholder="search for a city" id="search__bar"> 
    <button class="search__btn" type="button">
      <img src="/weather app/images/loupe.png">
    </button>

    <div class="search__history">
      <span>Recent</span>
      <span class="search__result">lagos</span>
      <span class="search__result">Abuja</span>
      <span class="search__result">Ghana</span>
    </div>

  </section>

  <section class="city">

    <div class="city__info">
      <h3 class="city__name">lagos, Nigeria</h3>
      <p class="city__date">wednesday, 13 October</p>
      <span class="city__temperature">29°</span>
      <span class="city__weather">light rain</span>

      <div class="city__high-low">
        <span class="city__high">High: 32°</span>
        <span class="city__low">Low: 27°</span>
      </div>
      
    </div>

    <img src="/weather app/images/cloud-raining-01-svgrepo-com.svg" class="city__weather-icon">

  </section>

  <section class="apr-temperature">

    <div class="humidity">
      <img src="/weather app/images/water-drop-svgrepo-com.svg" class="humidity__icon">
      <span class="humidity__heading">Humidity</span>
      <span class="humidity__value">79%</span>
    </div>

    <div class="wind-speed">
      <img src="/weather app/images/wind-svgrepo-com.svg" class="wind-speed__icon">
      <span class="wind-speed__heading">Wind</span>
      <span class="wind-speed__value">12 km/h</span>
    </div>

    <div class="feel-like">
      <img src="/weather app/images/thermometer-svgrepo-com.svg" class="feel-like__icon">
      <span class="feel-like__heading">Feels Like</span>
      <span class="feel-like__value">30°</span>
    </div>

  </section>

  <section class="forecast">
    <h5 class="forecast__heading">5-day forecast</h5>

    <div class="forecast__card">
      <span class="forecast__day">Thu</span>
      <img src="/weather app/images/sun-svgrepo-com.svg" class="forecast__icon">
      <div class="forecast__temperature">
        <span class="forecast__temperature-high">30°</span>
        <span class="forecast__temperature-low">27°</span>
      </div>
    </div>

    <div class="forecast__card">
      <span class="forecast__day">Fri</span>
      <img src="/weather app/images/cloud-svgrepo-com.svg" class="forecast__icon">
      <div class="forecast__temperature">
        <span class="forecast__temperature-high">30°</span>
        <span class="forecast__temperature-low">24°</span>
      </div>
    </div>

    <div class="forecast__card">
      <span class="forecast__day">Sat</span>
      <img src="/weather app/images/cloud-raining-01-svgrepo-com.svg" class="forecast__icon">
      <div class="forecast__temperature">
        <span class="forecast__temperature-high">28°</span>
        <span class="forecast__temperature-low">24°</span>
      </div>
    </div>

    <div class="forecast__card">
      <span class="forecast__day">sun</span>
      <img src="/weather app/images/cloud-raining-01-svgrepo-com.svg" class="forecast__icon">
      <div class="forecast__temperature">
        <span class="forecast__temperature-high">28°</span>
        <span class="forecast__temperature-low">23°</span>
      </div>
    </div>

    <div class="forecast__card">
      <span class="forecast__day">sun</span>
      <img src="/weather app/images/sun-svgrepo-com.svg" class="forecast__icon">
      <div class="forecast__temperature">
        <span class="forecast__temperature-high">31°</span>
        <span class="forecast__temperature-low">25°</span>
      </div>
    </div>
    
  </section>

  <script src="script.js"></script>
</body>
</html>
