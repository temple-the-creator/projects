<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>weather app</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header__logo">
      <img src="cloud.png" title="cloud icon" alt="cloud icon" class="header__logo-icon">
      <h2 class="header__logo-title">weather</h2>
    </div>

    <div class="temperature-unit">
      <label class="temperature-unit__cs">
        <input type="radio" value="celsius" name="unit" checked>
        <span>°C</span>
      </label>
      <label class="temperature-unit__fh">
        <input type="radio" value="fahrenheit" name="unit">
        <span>°F</span>
      </label>
    </div>
    

  </header>
</body>
</html>
